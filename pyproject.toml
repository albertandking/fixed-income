[project]
name = "fixed-income"
version = "0.1.0"
description = "面向中国高年级本科生的固定收益证券教材（理论·模型·中国市场实践，含可在线运行 notebook）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# 联网抓取中国市场数据：uv sync --extra data
data = [
    "akshare>=1.12",
    "tushare>=1.2",
]
# 衍生品与含权债定价：uv sync --extra quantlib
quantlib = [
    "QuantLib>=1.33",
]
# 成书工具链：uv sync --extra book
book = [
    "mkdocs-material>=9.5",
    "mkdocs-print-site-plugin>=2.4",
    "jupyter>=1.0",
    "nbconvert>=7.0",
]
# 导出 Word 版教材（另需系统安装 pandoc ≥ 3.8）：uv sync --extra docx
docx = [
    "python-docx>=1.2",
]
# 一键安装全部：uv sync --extra all
all = [
    "fixed-income[data,quantlib,book,docx]",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fi"]

[tool.uv]
package = true

# 默认索引固定为清华大学 TUNA 镜像：uv.lock 中的下载地址即指向该镜像，
# 固定后无论读者本机是否另配镜像，uv sync / uv run 都不会改写锁文件。
[[tool.uv.index]]
name = "tuna"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
default = true
